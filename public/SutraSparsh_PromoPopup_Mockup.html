<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SutraSparsh — Daily Verse</title>
<link rel="icon" type="image/png" href="/icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    /* Atmosphere Golden Hour & Mockup Tokens */
    --golden-butter-cream: #F6DFA6;
    --golden-soft-vanilla: #FFF4D8;
    --golden-ink-black: #171717;
    --golden-warm-gray: #A89F94;
    --golden-burnt-honey: #C9822B;

    --cream: #FBF3E6;
    --cream-deep: #F1E3CC;
    --ink: #2E2116;
    --ink-soft: #6B5843;
    --card: #FFFDF9;
    --terracotta: #E15A2E;
    --terracotta-deep: #C6461F;
    --gold: #D9A34C;
    --gold-soft: #EFD9A8;
    --rule: rgba(46,33,22,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Inter', -apple-system, sans-serif;
    background: linear-gradient(180deg, #F6ECDC 0%, #EFE1C7 100%);
    color: var(--ink);
    overflow:hidden;
  }

  /* ---------- Backdrop app screen (context only) ---------- */
  .app-screen{
    position:relative;
    width:100%; height:100vh;
    max-width:480px; margin:0 auto;
    padding: 28px 24px;
    filter: saturate(0.9);
  }
  .app-topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .app-greeting h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 26px;
    margin: 0 0 2px 0;
    color: var(--ink);
  }
  .app-greeting p{
    margin:0; font-size: 14px; color: var(--ink-soft);
  }
  .app-avatar{
    width:38px; height:38px; border-radius:50%;
    background: var(--card);
    border: 1px solid var(--rule);
    background-image: url('/icon.png');
    background-size: cover;
  }
  .app-card{
    margin-top: 26px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 18px;
    padding: 20px;
  }
  .app-card .label{
    font-size: 12px; letter-spacing: 0.02em; color: var(--terracotta-deep);
    margin: 0 0 10px 0; font-weight:600;
  }
  .app-card .line{
    height: 10px; border-radius: 6px; background: var(--rule);
    margin-bottom: 9px;
  }
  .app-card .line:nth-child(2){ width: 92%; }
  .app-card .line:nth-child(3){ width: 78%; }
  .app-card .line:nth-child(4){ width: 60%; }

  .app-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 14px;
    margin-top: 20px;
  }
  .app-tile{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 16px;
    height: 78px;
  }

  /* ---------- Popup overlay ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(30, 20, 12, 0.55);
    backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    opacity: 1;
    transition: opacity 0.5s ease;
    z-index: 50;
  }
  .overlay.hide{
    opacity: 0;
    pointer-events: none;
  }

  .popup{
    position: relative;
    width: 100%; max-width: 360px;
    background: var(--cream);
    border-radius: 26px;
    padding: 30px 26px 24px 26px;
    box-shadow: 0 24px 60px rgba(46, 33, 22, 0.35);
    text-align:center;
    transform: translateY(0) scale(1);
    transition: transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s ease;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .overlay.hide .popup{
    transform: translateY(10px) scale(0.96);
    opacity: 0;
  }

  .popup::before{
    content:"";
    position:absolute; inset: 0;
    border-radius: 26px;
    padding: 1px;
    background: linear-gradient(135deg, var(--gold-soft), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
  }

  .close-btn{
    position:absolute; top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 15px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .close-btn:hover{ background: var(--gold-soft); color: var(--ink); }
  .close-btn:active{ transform: scale(0.92); }

  .logo-chip{
    width: 118px;
    margin: 4px auto 18px auto;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 18px rgba(198, 70, 31, 0.28);
    background: #171717;
  }
  .logo-chip img{
    display:block; width:100%; height:auto;
  }

  .popup h2{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: 25px;
    line-height: 1.25;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  .popup h2 em{
    font-style: italic;
    color: var(--terracotta-deep);
  }

  .popup p.sub{
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 20px 0;
    padding: 0 6px;
  }

  .divider{
    display:flex; align-items:center; gap: 10px;
    margin: 0 0 18px 0;
  }
  .divider .line{ flex:1; height:1px; background: var(--rule); }
  .divider .dot{ width:5px; height:5px; border-radius:50%; background: var(--gold); }

  .verse-card{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 16px 16px 14px 16px;
    text-align:left;
    margin-bottom: 20px;
  }
  .verse-card .devanagari{
    font-family:'Fraunces', serif;
    font-size: 15px;
    color: var(--terracotta-deep);
    line-height: 1.6;
    margin: 0 0 8px 0;
  }
  .verse-card .translation{
    font-size: 13px;
    font-style: italic;
    color: var(--ink);
    line-height: 1.5;
    margin: 0 0 6px 0;
  }
  .verse-card .source{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin:0;
  }

  .cta{
    display:block;
    width:100%;
    padding: 13px 18px;
    background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-deep) 100%);
    color: #FFF6EC;
    border: none;
    border-radius: 13px;
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor:pointer;
    box-shadow: 0 10px 20px rgba(198, 70, 31, 0.32);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover{ transform: translateY(-1px); box-shadow: 0 12px 24px rgba(198, 70, 31, 0.4); }
  .cta:active{ transform: translateY(0); }

  .progress-track{
    width: 44px; height: 3px;
    background: var(--rule);
    border-radius: 3px;
    margin: 16px auto 0 auto;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width: 100%;
    background: var(--gold);
    transform-origin: left;
    animation: deplete 5s linear forwards;
  }
  @keyframes deplete{
    from{ transform: scaleX(1); }
    to{ transform: scaleX(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .popup, .overlay, .cta, .close-btn{ transition:none; }
    .progress-fill{ animation:none; }
  }
</style>
</head>
<body>

  <div class="app-screen">
    <div class="app-topbar">
      <div class="app-greeting">
        <h1>Namaste 🙏</h1>
        <p>Good morning</p>
      </div>
      <div class="app-avatar"></div>
    </div>

    <div class="app-card">
      <p class="label">Today's verse</p>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <div class="app-grid">
      <div class="app-tile"></div>
      <div class="app-tile"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup" role="dialog" aria-label="Daily verse promo">
      <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>

      <div class="logo-chip">
        <img src="/icon.png" alt="SutraSparsh">
      </div>

      <h2>A new day,<br><em>a new discovery.</em></h2>
      <p class="sub">Begin your day with timeless wisdom that enlightens and inspires.</p>

      <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>

      <!-- Sacred Verse Preview -->
      <div class="verse-card">
        <div class="devanagari">योगः कर्मसु कौशलम्</div>
        <div class="translation">"Excellence and harmony in action is Yoga."</div>
        <div class="source">— Bhagavad Gita 2.50 • प्रातः स्मरण</div>
      </div>

      <button class="cta" id="ctaBtn">Explore today's verse</button>

      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

<script>
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const ctaBtn = document.getElementById('ctaBtn');
  let dismissed = false;
  let autoTimer = setTimeout(dismiss, 5000);

  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    overlay.classList.add('hide');
    setTimeout(() => { 
      overlay.style.display = 'none'; 
      // Record today in localStorage
      try {
        localStorage.setItem('sutrasparsh_promo_last_date', new Date().toISOString().slice(0, 10));
      } catch (e) {}
      // If opened in parent or redirected to app
      if (window.location.search.includes('return=app')) {
        window.location.href = '/';
      }
    }, 500);
  }

  closeBtn.addEventListener('click', () => { clearTimeout(autoTimer); dismiss(); });
  ctaBtn.addEventListener('click', () => { 
    clearTimeout(autoTimer); 
    dismiss(); 
    window.location.href = '/';
  });
</script>

</body>
</html>
